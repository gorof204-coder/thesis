<!doctype html>
<html lang="so">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Thesis Project Manager</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sb: #384fba;
        --sbtx: rgba(255, 255, 255, 0.82);
        --sbh: #fff;
        --on: rgba(255, 255, 255, 0.18);
        --onx: #fff;
        --hv: rgba(255, 255, 255, 0.1);
        --sbl: transparent;
        --bg: #eef0f6;
        --bg2: #e4e7f1;
        --card: #ffffff;
        --line: #dde0ec;
        --ink: #1d2033;
        --mut: #62677f;
        --acc: #384fba;
        --in: #f5f6fb;
        --sh: 0 6px 20px rgba(40, 50, 110, 0.08);
        --btn: #384fba;
        --btnh: #2f43a3;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --sb: #1e1f25;
          --sbtx: #a8acbc;
          --sbh: #fff;
          --on: #384fba;
          --onx: #fff;
          --hv: rgba(255, 255, 255, 0.07);
          --sbl: #2e3039;
          --bg: #17181c;
          --bg2: #1f2026;
          --card: #24252b;
          --line: #34363f;
          --ink: #e6e8ef;
          --mut: #9fa3b4;
          --acc: #7389ee;
          --in: #1b1c21;
          --sh: 0 6px 22px rgba(0, 0, 0, 0.35);
          --btn: #3390ec;
          --btnh: #5a71e2;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --sb: #1e1f25;
        --sbtx: #a8acbc;
        --sbh: #fff;
        --on: #384fba;
        --onx: #fff;
        --hv: rgba(255, 255, 255, 0.07);
        --sbl: #2e3039;
        --bg: #17181c;
        --bg2: #1f2026;
        --card: #24252b;
        --line: #34363f;
        --ink: #e6e8ef;
        --mut: #9fa3b4;
        --acc: #7389ee;
        --in: #1b1c21;
        --sh: 0 6px 22px rgba(0, 0, 0, 0.35);
        --btn: #3390ec;
        --btnh: #5a71e2;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --sb: #384fba;
        --sbtx: rgba(255, 255, 255, 0.82);
        --sbh: #fff;
        --on: rgba(255, 255, 255, 0.18);
        --onx: #fff;
        --hv: rgba(255, 255, 255, 0.1);
        --sbl: transparent;
        --bg: #eef0f6;
        --bg2: #e4e7f1;
        --card: #ffffff;
        --line: #dde0ec;
        --ink: #1d2033;
        --mut: #62677f;
        --acc: #384fba;
        --in: #f5f6fb;
        --sh: 0 6px 20px rgba(40, 50, 110, 0.08);
        --btn: #384fba;
        --btnh: #2f43a3;
        color-scheme: light;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "DM Sans", system-ui, sans-serif;
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        min-height: 100vh;
      }
      button {
        font: inherit;
        cursor: pointer;
        background: none;
        border: 0;
        color: inherit;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--sh);
      }
      .lift {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .lift:hover {
        border-color: var(--acc);
      }
      .inp {
        background: var(--in);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.55rem 0.8rem;
        color: var(--ink);
        width: 100%;
        min-height: 44px;
        font: inherit;
      }
      .inp:focus,
      button:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 1px;
      }
      .btn {
        background: var(--btn);
        color: #fff;
        border-radius: 12px;
        padding: 0.55rem 1rem;
        font-weight: 600;
        min-height: 44px;
        box-shadow: 0 4px 12px rgba(56, 79, 186, 0.25);
        transition: transform 0.15s;
        display: inline-flex;
        gap: 0.45rem;
        align-items: center;
        justify-content: center;
      }
      .btn:hover {
        background: var(--btnh);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .b2 {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 12px;
        padding: 0.45rem 0.75rem;
        min-height: 40px;
        display: inline-flex;
        gap: 0.4rem;
        align-items: center;
      }
      .b2:hover {
        border-color: var(--acc);
      }
      .ic {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .mut {
        color: var(--mut);
      }
      .nav {
        display: flex;
        gap: 0.7rem;
        align-items: center;
        padding: 0.55rem 0.85rem;
        border-radius: 12px;
        width: 100%;
        text-align: left;
        color: var(--sbtx);
        transition: background 0.15s;
      }
      .nav:hover {
        background: var(--hv);
      }
      .nav.on {
        background: var(--on);
        color: var(--onx);
        font-weight: 600;
        box-shadow: inset 3px 0 0 #fff;
      }
      .wk {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        color: #fff;
        font-weight: 700;
        flex: none;
        display: grid;
        place-items: center;
      }
      .w1 {
        background: #3fbf7f;
      }
      .w0 {
        background: #ef4444;
      }
      .wn {
        background: var(--line);
        color: var(--mut);
      }
      .badge {
        padding: 0.15rem 0.6rem;
        border-radius: 9px;
        font-size: 0.78rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .pill {
        display: inline-flex;
        gap: 0.3rem;
        align-items: center;
        border-radius: 999px;
        padding: 0.25rem 0.7rem;
        background: var(--bg2);
        border: 1px solid var(--line);
        font-size: 0.9rem;
      }
      .pill.sel {
        background: var(--btn);
        color: #fff;
        border-color: var(--btn);
      }
      [role="option"]:hover {
        background: var(--bg2);
      }
      .pop {
        animation: pop 0.18s ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      .sec {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--sbtx);
        padding: 1rem 0.85rem 0.35rem;
      }
      .trg {
        display: grid;
        gap: 14px;
      }
      @media (min-width: 1024px) {
        .trg {
          grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.2fr) 296px 190px;
        }
      }
      th {
        text-align: left;
        font-weight: 500;
        color: var(--mut);
        font-size: 0.85rem;
        padding: 0.75rem;
      }
      td {
        padding: 0.7rem 0.75rem;
        border-top: 1px solid var(--line);
      }
      .sbar {
        transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      /* ===== v3 design: calm teal/slate, square corners ===== */
      :root,:root[data-theme="light"]{--sb:#1b2a2e;--sbtx:rgba(255,255,255,.72);--on:#0f766e;--hv:rgba(255,255,255,.08);--sbl:transparent;--bg:#f2f3ef;--bg2:#eceee9;--card:#fff;--line:#d8dcd3;--ink:#1d2a2c;--mut:#5e6c6d;--acc:#0f766e;--in:#f7f8f5;--sh:none;--btn:#0f766e;--btnh:#0b5f58;color-scheme:light}
      @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sb:#0e1315;--sbtx:#9aa8a7;--on:#1b8a7f;--hv:rgba(255,255,255,.06);--sbl:#232c30;--bg:#121719;--bg2:#181e21;--card:#1a2124;--line:#2a3337;--ink:#e3e9e7;--mut:#94a3a2;--acc:#4fb8aa;--in:#12181a;--sh:none;--btn:#1b8a7f;--btnh:#229c90;color-scheme:dark}}
      :root[data-theme="dark"]{--sb:#0e1315;--sbtx:#9aa8a7;--on:#1b8a7f;--hv:rgba(255,255,255,.06);--sbl:#232c30;--bg:#121719;--bg2:#181e21;--card:#1a2124;--line:#2a3337;--ink:#e3e9e7;--mut:#94a3a2;--acc:#4fb8aa;--in:#12181a;--sh:none;--btn:#1b8a7f;--btnh:#229c90;color-scheme:dark}
      .card,.inp,.btn,.b2,.nav,.pill,.badge,.wk,.rounded-xl,.rounded-2xl,.rounded-lg{border-radius:var(--rad,4px)!important}
      .btn{box-shadow:none}.btn.sm{min-height:36px;padding:.3rem .8rem;font-size:.9rem}
      *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
      ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
      table{border-collapse:separate;border-spacing:0 6px}
      th{padding:.4rem .75rem;font-size:.8rem}
      td{border:0;background:var(--bg2);padding:.75rem}
      td:first-child{border-radius:4px 0 0 4px}td:last-child{border-radius:0 4px 4px 0}
      tbody tr:hover td{background:var(--line)}
      .card>.scroll,.card.scroll{padding:0 .6rem .3rem}
      .nav.on{box-shadow:inset 3px 0 0 var(--acc)}
      .kpi{display:flex;gap:.7rem;align-items:center;padding:.7rem .8rem}
      .kic{width:34px;height:34px;display:grid;place-items:center;background:var(--bg2);border-radius:4px;flex:none}
      .pill{position:relative;cursor:pointer;border-radius:4px}
      .pill input[type=checkbox]{position:absolute;opacity:0;width:0;height:0}
      .pill:has(input:checked){background:var(--btn);color:#fff;border-color:var(--btn)}
      .pill:has(input:checked)::before{content:"\2713";font-weight:700}
      .pill:has(input:focus-visible){outline:2px solid var(--acc)}
      .chipx{display:inline-flex;margin-left:.3rem;padding:2px;border-radius:3px}.chipx:hover{background:rgba(255,255,255,.25)}.chipx .ic{width:14px;height:14px}
      /* ===== v4 colors from reference: near-black + orange ===== */
      :root,:root[data-theme="light"]{--sb:#1a1a1a;--sbtx:rgba(255,255,255,.7);--on:#3390ec;--onx:#fff;--hv:rgba(255,255,255,.07);--sbl:transparent;--bg:#f4f2ef;--bg2:#ece9e4;--card:#fff;--line:#ddd8d1;--ink:#1b1a19;--mut:#6d6862;--acc:#c9461a;--in:#faf9f7;--btn:#c9461a;--btnh:#ad3b15;--onbtn:#fff}
      @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sb:#17212b;--sbtx:#7f91a4;--on:#3390ec;--onx:#fff;--hv:rgba(255,255,255,.06);--sbl:#0e1621;--bg:#0e1621;--bg2:#1e2c3a;--card:#17212b;--line:#243447;--ink:#f5f5f5;--mut:#7f91a4;--acc:#3390ec;--in:#0e1621;--btn:#3390ec;--btnh:#5aa9f2;--onbtn:#fff}}
      :root[data-theme="dark"]{--sb:#17212b;--sbtx:#7f91a4;--on:#3390ec;--onx:#fff;--hv:rgba(255,255,255,.06);--sbl:#0e1621;--bg:#0e1621;--bg2:#1e2c3a;--card:#17212b;--line:#243447;--ink:#f5f5f5;--mut:#7f91a4;--acc:#3390ec;--in:#0e1621;--btn:#3390ec;--btnh:#5aa9f2;--onbtn:#fff}
      .btn,.pill.sel,.pill:has(input:checked){color:var(--onbtn)!important}
      /* ===== v5 light theme: clean blue, Telegram-like ===== */
      :root,:root[data-theme="light"]{--sb:#2b5278;--sbh:#fff;--sbtx:rgba(255,255,255,.78);--on:#3390ec;--onx:#fff;--hv:rgba(255,255,255,.09);--sbl:transparent;--bg:#f1f3f5;--bg2:#f1f3f5;--card:#fff;--line:#e4e6e9;--ink:#17212b;--mut:#707579;--acc:#3390ec;--in:#f4f5f7;--btn:#3390ec;--btnh:#2b7fd0;--onbtn:#fff}
      .tk{border:1px solid var(--line);background:var(--bg2);border-radius:4px;padding:.8rem;margin-bottom:.75rem}
          .tg{display:grid;gap:.5rem;align-items:center}
      @media (min-width:768px){.tg{grid-template-columns:32px minmax(0,1fr) minmax(0,1fr) auto}}
      .inp.xs{min-height:36px;padding:.3rem .6rem;font-size:.9rem}
      .b2.xs{min-height:32px;padding:.2rem .55rem;font-size:.85rem}
      .vid{display:block;width:100%;height:auto;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);object-fit:contain;background:#000;border-radius:var(--rad,4px)}
      /* ===== v6: one video per week, supervisor next-video, student dock ===== */
      .vtile{display:flex;align-items:center;gap:.5rem;width:100%;padding:.4rem .5rem .4rem .7rem;border:1px solid var(--line);background:var(--bg2);border-radius:var(--rad,4px)}
      .vtile .vw{flex:1;text-align:left;font-weight:600;color:var(--acc);min-height:36px}
      .vtile.add{justify-content:center;padding:.6rem;border-style:dashed;color:var(--acc);font-weight:600;min-height:48px}
      .vtile.add:hover{border-color:var(--acc)}
      .vbtn{display:inline-flex;align-items:center;gap:.4rem;min-height:40px;padding:.4rem .9rem;border-radius:var(--rad,4px)!important;background:var(--btn);color:#fff!important;font-weight:600;white-space:nowrap}
      .vbtn.seen{background:transparent;color:var(--acc)!important;border:1px solid var(--acc)}
      .nxv{white-space:nowrap}.nxv[disabled]{opacity:.45;cursor:not-allowed}
      .dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.1)}
      .dock>div{flex:1;min-width:0}.dock .vbtn{min-height:48px;padding:.5rem 1.2rem}
      @media(min-width:1024px){.dock{left:16rem}}
      .tw .wk{width:40px;height:40px}
      .tsave{position:sticky;bottom:0;z-index:5;padding:1rem 0 calc(.75rem + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
      @media(min-width:1024px){.trg{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 296px minmax(0,1.1fr)}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div
      id="toasts"
      class="fixed right-3 z-50 flex flex-col gap-2"
      style="bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px))"
    ></div>
    <script>
      /* ===== icons (flat, stroke) ===== */
      const IC = {
        home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/>',
        trk: '<path d="M3 3v18h18M7 14l4-4 4 4 5-6"/>',
        fold: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
        users:
          '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
        book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>',
        cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
        user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
        list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
        out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
        menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        x: '<path d="M18 6 6 18M6 6l12 12"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        dl: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
        ul: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
        task: '<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
      };
      IC.chev = '<path d="m6 9 6 6 6-6"/>';
      IC.lock = '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>';
      IC.cog = '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>';
      IC.edit =
        '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>';
      IC.trash =
        '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>';
      const I = (n) =>
        `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
      /* ===== data layer (localStorage; replace with API later) ===== */
      const mkS = (n) => {
          const m = {};
          try {
            const t = window[n];
            t.setItem("__t", "1");
            t.removeItem("__t");
            return t;
          } catch (e) {
            return {
              getItem: (k) => (k in m ? m[k] : null),
              setItem: (k, v) => {
                m[k] = String(v);
              },
              removeItem: (k) => {
                delete m[k];
              },
            };
          }
        },
        LS = mkS("localStorage"),
        SS = mkS("sessionStorage");
      const K = "tpm_v2",
        SL = ["4:00 PM", "5:00 PM", "6:30 PM", "7:30 PM"],
        DAYS = [
          "Saturday",
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
        ],
        TH = ["8:00 AM", "9:00 AM", "10:00 AM"],
        SLD = (d) => (d === "Thursday" ? TH : SL),
        MAXC = 23;
      const seed = () => ({
        users: [
          {
            id: 1,
            name: "System Admin",
            phone: "admin",
            username: "admin",
            password: "admin123",
            role: "admin",
          },
          {
            id: 2,

<div class="flex gap-2 mb-3">${[

${

      function newProj() {
        const o = document.createElement("div");
        o.className =
          "fixed inset-0 z-40 grid place-items-center p-3 bg-black/50";
        let mem = [],
          okT = false;
        o.innerHTML = `<form class="card p-5 w-full max-w-md pop max-h-[92vh] overflow-y-auto"><div class="flex items-center mb-3"><h2 class="text-lg font-bold flex-1">New project</h2><button type="button" id="cx" class="b2" aria-label="Close">${I("x")}</button></div>
<label class="block mb-1"><span class="mut text-sm">Title</span><input name="t" class="inp mt-1" autocomplete="off" required></label><p id="tm" class="text-sm min-h-6 mb-2"></p>

        document.body.append(o);

              '<span class="mut text-sm">No available students</span>'
            : '<span class="mut text-sm">Choose a class first</span>';
        };
        draw();
        f.t.oninput = () => {
          const t = f.t.value.trim(),
            d =
              t &&
              DB.projects.find(
                (p) => p.status !== "Rejected" && norm(p.title) === norm(t),
              ),
            m = o.querySelector("#tm");
          okT = !!t && !d;
          m.className =
            "text-sm min-h-6 mb-2 " + (d ? "text-red-500" : "text-green-500");
          m.textContent = !t
            ? ""
            : d
              ? "another one exist named " + d.title
              : "Title is available ✓";
        };
        f.c.onchange = () => {
          mem = [];
          draw();

            if (mem.length >= 3)
              return (o.querySelector("#me").textContent =
                "A group can have at most 3 students.");

            draw();
          }

        f.onsubmit = (e) => {

          DB.projects.push({

${
  can

}
<div class="grid sm:grid-cols-3 gap-2 mb-4"><input id="q" data-f="q" class="inp" placeholder="Search name or phone..." value="${esc(S.q)}">${cb("cls", [["", "All classes"], ...VC().map((c) => [c.name, c.name])], S.cls)}${cb(

${S.staged ? prev() : ""}<div class="card"><div class="scroll"><table><thead><tr><th>Name</th><th>Class</th><th>Phone</th><th>Status</th><th></th></tr></thead><tbody>${ps.rows.map((s) => `<tr><td>${esc(s.name)}</td><td>${esc(cn(s.cls))}</td><td>${esc(s.phone)}</td><td>${bd(stat(s))}</td><td class="text-right"><div class="flex gap-2 justify-end">${rpw() ? `<button class="b2" data-a="spr" data-id="${s.id}" title="Reset password to default (last 4 digits)">${I("lock")}Reset password</button>` : ""}${can ? act("s", s.id) : ""}</div></td></tr>`).join("") || '<tr><td colspan=4 class="mut p-6">No students found.</td></tr>'}</tbody></table></div>${tbp(ps.html)}</div>`;
      }
      const prev = () => {

        return `<div class="card p-4 mb-4 pop"><h2 class="font-semibold">Preview: ${esc(g.cls || "no class")} ${g.isNew ? "(new class)" : ""}</h2><p class="mut text-sm mb-2">${ok} valid, ${g.rows.length - ok} with problems</p><div class="scroll" style="max-height:240px"><table>${vp.rows.map((r) => `<tr><td>${esc(r.Name)}</td><td>${esc(r.Phone)}</td><td class="${r.err ? "text-red-500" : "text-green-500"}">${r.err || "OK"}</td></tr>`).join("")}</table></div>${vp.html}<div class="flex gap-2 mt-3"><button class="btn" data-a="ok">Save ${ok} students</button><button class="b2" data-a="no">Cancel</button></div></div>`;
      };
      function stage(file) {
        const r = new FileReader();
        r.onload = (e) => {
          try {
            const w = XLSX.read(e.target.result, { type: "array" }),
              rows = XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]], {
                defval: "",
              }),
              cls =
                [
                  ...new Set(
                    rows
                      .map((x) => String(x.Class || "").trim())
                      .filter(Boolean),
                  ),
                ][0] || "",
              seen = new Set(DB.students.map((s) => s.phone));
            rows.forEach((x) => {
              x.Phone = String(x.Phone || "").trim();
              x.err = !x.Name
                ? "Missing name"
                : !x.Phone
                  ? "Missing phone"
                  : seen.has(x.Phone)

      function commit() {

      /* ===== classes + assignment ===== */

      /* ===== searchable combo for every <select> (same look as filter combos) ===== */
      function enh(s) {
        if (s.dataset.sc) return;
        s.dataset.sc = 1;
        const w = document.createElement("div");
        w.className = "cbx2 relative";
        s.before(w);
        w.append(s);
        const cls = s.className;
        s.className = "";
        s.tabIndex = -1;
        s.style.cssText =
          "position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none";
        const b = document.createElement("button");
        b.type = "button";
        b.className =
          cls + " flex items-center justify-between gap-2 text-left";
        b.setAttribute("aria-haspopup", "listbox");
        b.innerHTML =
          '<span class="truncate"></span><span style="display:flex;transition:transform .15s">' +
          I("chev") +
          "</span>";
        w.append(b);
        const lab = () => {
          const o = s.options[s.selectedIndex];
          b.firstChild.textContent = o ? o.text : "";
        };
        lab();
        new MutationObserver(lab).observe(s, {
          childList: true,
          subtree: true,
          attributes: true,
        });
        s.addEventListener("change", lab);
        let p = null;
        const close = () => {
          if (p) {
            p.remove();
            p = null;
            b.style.cssText = "";
            b.setAttribute("aria-expanded", "false");
            b.lastChild.style.transform = "";
          }
        };
        w._close = close;
        const list = (q) => {
          const l = [...s.options].filter((o) => lc(o.text, q));
          p.querySelector("[role=listbox]").innerHTML =
            l
              .map(
                (o) =>
                  `<button type="button" role="option" class="w-full text-left px-3 py-2 rounded-lg" data-v="${esc(o.value)}" style="${o.value === s.value ? "color:var(--acc);font-weight:600" : ""}">${esc(o.text)}</button>`,
              )
              .join("") || '<p class="mut text-sm px-3 py-2">No results</p>';
        };
        b.onclick = () => {
          if (p) return close();
          p = document.createElement("div");
          p.className = "absolute left-0 right-0 mt-1 p-2 card";
          p.style.zIndex = 60;
          p.innerHTML =
            '<input class="inp mb-1" placeholder="Search..." autocomplete="off"><div class="overflow-y-auto" style="max-height:200px" role="listbox"></div>';
          w.append(p);
          b.style.cssText =
            "border-color:var(--acc);box-shadow:0 0 0 2px rgba(47,123,255,.25)";
          b.setAttribute("aria-expanded", "true");
          b.lastChild.style.transform = "rotate(180deg)";
          list("");
          const i = p.querySelector("input");
          i.focus();
          i.oninput = () => list(i.value);
          p.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const o = e.target.closest("[data-v]");
            if (o) {
              s.value = o.dataset.v;
              close();
              s.dispatchEvent(new Event("change", { bubbles: true }));
            }
          };
          i.onkeydown = (e) => {
            if (e.key === "Escape") close();
            if (e.key === "Enter") {
              e.preventDefault();
              const f = p.querySelector("[data-v]");
              if (f) f.click();
            }
          };
        };
      }
      const enhAll = (r) =>
        (r.matches && r.matches("select") ? [r] : [])
          .concat([...(r.querySelectorAll ? r.querySelectorAll("select") : [])])
          .forEach(enh);
      new MutationObserver((m) =>
        m.forEach((x) =>
          x.addedNodes.forEach((n) => n.nodeType === 1 && enhAll(n)),
        ),
      ).observe(document.body, { childList: true, subtree: true });
      document.addEventListener("click", (e) =>
        document.querySelectorAll(".cbx2").forEach((w) => {
          if (!w.contains(e.target)) w._close && w._close();
        }),
      );
      autoRel();
      render();
      enhAll(document.body);
      scan(true);
    </script>
